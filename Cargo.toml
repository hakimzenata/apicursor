[package]
name = "workspace"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Server
tokio = { version = "1.26.0", features = ["full"] }
axum = { version = "0.8.1", features = ["macros"] }
hyper = "1.5.2"

# Environment
dotenvy = "0.15.0"

# JSON
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"

# Date
chrono = "0.4.39"

# Static
lazy_static = "1.4.0"

# Logging
tracing = "0.1.37"
tracing-subscriber = "0.3"

# Redis
redis = "0.28.1"
redis-async = "0.17.2"

# Connection Pooling
bb8 = "*"
bb8-redis = "*"

[dev-dependencies]
tempfile = "3.8"
